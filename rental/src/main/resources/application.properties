# Server Configuration
server.port=8080

# ================ Cache Configuration ================
# Use simple in-memory cache (no Redis required for development)
# Change to 'redis' when Redis server is available
spring.cache.type=simple

# Redis connection (optional - only when spring.cache.type=redis)
# spring.data.redis.host=localhost
# spring.data.redis.port=6379

# ================ Logging ================
logging.level.org.springframework.cache=DEBUG
logging.level.vehiclerentalsystem=INFO